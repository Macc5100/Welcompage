<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex AI & Ads - AI Chatbot & Anti-Bot Sales Pages for Media Buyers</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark-glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-indigo-500 selection:text-white antialiased overflow-x-hidden" x-data="{ promoModal: true }">

    <!-- Promotional Welcome Modal Popup -->
    <div x-show="promoModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm transition-all" x-transition.opacity>
        <div @click.away="promoModal = false" class="relative max-w-lg w-full bg-gradient-to-br from-indigo-950 via-slate-900 to-violet-950 text-white rounded-3xl p-8 shadow-2xl border border-indigo-500/40 text-center overflow-hidden">
            <div class="absolute -right-16 -top-16 w-48 h-48 bg-indigo-500/30 rounded-full blur-3xl"></div>
            
            <button @click="promoModal = false" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <span class="inline-block bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 text-xs font-extrabold px-3.5 py-1.5 rounded-full uppercase tracking-wider mb-4 shadow-md">
                🔥 แพ็กเกจพิเศษสำหรับธุรกิจ / SME
            </span>

            <h3 class="text-2xl sm:text-3xl font-extrabold mb-3 leading-snug">
                ยกระดับยอดขาย SME
            </h3>
            
            <p class="text-indigo-200 text-sm mb-6 leading-relaxed">
                คุ้มที่สุด! เหมาแพ็กเกจติดสปีด Anti-Bot + AI Chatbot นาน 3 เดือน <span class="text-amber-400 font-bold text-lg">฿5,989 ทั้งหมด</span> (เฉลี่ยเพียงเดือนละเกือบ 2 พัน)
            </p>

            <div class="bg-white/10 rounded-2xl p-4 mb-6 text-left space-y-2 text-xs text-slate-200 border border-white/10">
                <div class="flex items-center"><i class="fa-solid fa-check text-emerald-400 mr-2"></i> เหมาจ่ายระบบป้องกันบอท 3 เดือน + ระบบ Anti-Bot
